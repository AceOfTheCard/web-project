<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }
    body {
      background-color: #f1f7ff;
      color: #444;
      text-align: center;
      line-height: 1.6;
    }
    .thank-you-container {
      padding: 100px 20px;
    }
    h1 {
      font-size: 50px;
      font-weight: 700;
      color: #7b57d8;
      margin-bottom: 20px;
    }
    p {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
    }
    .btn {
      display: inline-block;
      background: #7b57d8;
      color: #fff;
      padding: 12px 28px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 16px;
      text-decoration: none;
      transition: background 0.3s;
    }
    .btn:hover {
      background: #6a47b6;
    }
    footer {
      margin-top: 50px;
      font-size: 14px;
      color: #888;
    }
  </style>
</head>
<body>

  <div class="thank-you-container">
    <h1>Thank You!</h1>
    <p>Your registration has been successfully received. We will get in touch with you soon!</p>
    <a href="index.html" class="btn">Back to Home</a>
  </div>

  <footer>
    <p>© 2025 VOIA. All rights reserved.</p>
  </footer>

</body>
</html>
