<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Become a Volunteer - VOIA</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f9f9fc;
      margin: 0;
      padding: 0;
      color: #333;
    }

    .container {
      max-width: 600px;
      margin: 60px auto;
      background-color: white;
      border-radius: 10px;
      padding: 40px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
      color: #7f3ac1;
      margin-bottom: 30px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    label {
      font-weight: bold;
      margin-bottom: 5px;
    }

    input, textarea {
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
      width: 100%;
      box-sizing: border-box;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    .submit-btn {
      background-color: #1E3A8A;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 6px;
      font-size: 1.1rem;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .submit-btn:hover {
      background-color: #FBBF24;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 0.9rem;
      color: #777;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Become a Volunteer</h1>
    <form>
      <div>
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="Your full name" required>
      </div>

      <div>
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>
      </div>

      <div>
        <label for="why">Why do you want to volunteer with VOIA?</label>
        <textarea id="why" name="why" placeholder="Share your motivation..." required></textarea>
      </div>

      <div>
        <label for="skills">What skills can you bring? (optional)</label>
        <input type="text" id="skills" name="skills" placeholder="e.g. Design, Coding, Communication">
      </div>

      <button type="submit" class="submit-btn">Submit Application</button>
    </form>

    <div class="footer">
      Thank you for your interest in helping the VOIA community 💜
    </div>
  </div>

</body>
</html>
